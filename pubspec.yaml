name: flutter_layout_practice
description: Flutter implementation of Figma layouts for practical work.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_lints: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/atlantis.png
    - assets/images/meditate_reference.png
    - assets/images/course_3d.jpg
    - assets/images/wallet_reference.png
    - assets/images/course_reference.png
